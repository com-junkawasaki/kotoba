name: Native CLI release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-amd64
          - os: ubuntu-24.04
            platform: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned language qualification authority
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotoba-lang
          # kotoba-lang main 2026-08-13: guest-grammar sha256 ed2012db matches
          # kotoba 2e6d6367. Pre-profile-6 pin 7adcda58 cannot qualify this line.
          ref: dd8bcb62dee18ee9b1ca126ad7a2f1fbf55c7ecb
          path: _authority/kotoba-lang
          persist-credentials: false
      - name: Checkout pinned Amu qualification evidence
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/amu
          ref: 249b9408d236d6766d04794d6a3cb04cb894b7dc
          path: _evidence/amu
          persist-credentials: false
      - name: Checkout pinned kototama qualification evidence
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kototama
          ref: d96f717b202830a1a50a28fb3b59a811987cfcdb
          path: _evidence/kototama
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Verify release source and safety contracts
        run: clojure -M:test
        env:
          KOTOBA_LANG_AUTHORITY_ROOT: ${{ github.workspace }}/_authority/kotoba-lang
          KOTOBA_COMPILER_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/amu
          KOTOTAMA_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/kototama
      - run: chmod +x scripts/build-native.sh && scripts/build-native.sh
      - name: Verify JVM-free release boundary
        run: |
          set -eu
          case "${GITHUB_REF}" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)
              echo "native-release: JVM-free verify requires a vMAJOR.MINOR.PATCH tag (got ${GITHUB_REF})" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "native-release: tag must be vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          node scripts/verify-release-binary.mjs target/native/kotoba \
            --release-version "$VERSION" \
            --language-profile 6 \
            --package-contract 1 \
            --commit "$(git rev-parse HEAD)" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --platform "${{ matrix.platform }}"
      - name: Record release evidence
        run: |
          mkdir -p target/release-evidence
          cp target/native/release-evidence.json \
            "target/release-evidence/kotoba-${{ matrix.platform }}.json"
      - name: Package
        run: |
          mkdir -p "target/package"
          cp target/native/kotoba LICENSE README.md "target/package/"
          tar -C target/package -czf "target/kotoba-${{ matrix.platform }}.tar.gz" kotoba LICENSE README.md
          (cd target && shasum -a 256 "kotoba-${{ matrix.platform }}.tar.gz" > "kotoba-${{ matrix.platform }}.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/kotoba-${{ matrix.platform }}.tar.gz
            target/kotoba-${{ matrix.platform }}.tar.gz.sha256
            target/release-evidence/kotoba-${{ matrix.platform }}.json
